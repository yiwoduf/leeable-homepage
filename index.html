  <meta name="twitter:card" content="summary" />

  <!-- Apply saved language/theme before first paint (mirrors LanguageProvider/useTheme logic) to avoid a font/theme flash. -->
  <script>
    (function () {
      var d = document.documentElement;
      try {
        var t = localStorage.getItem('leeable:theme');
        if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
        var l = localStorage.getItem('leeable:lang');
        if (l !== 'en' && l !== 'ko') l = (navigator.language || '').indexOf('ko') === 0 ? 'ko' : 'en';
        d.setAttribute('lang', l);
        d.setAttribute('data-lang', l);
      } catch (e) { /* storage unavailable — keep defaults */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
